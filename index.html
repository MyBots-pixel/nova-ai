<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            height: 100vh;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #080d19;
            border-right: 1px solid #20283a;
            padding: 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .new-chat {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 65px;
            border-bottom: 1px solid #20283a;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #9ca6bb;
            font-size: 17px;
        }

        .input-area {
            width: min(750px, 90%);
        }

        .input-box {
            display: flex;
            background: #151c2d;
            border: 1px solid #303a52;
            border-radius: 16px;
            padding: 8px;
        }

        input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 12px;
        }

        .send {
            width: 45px;
            border: 0;
            border-radius: 12px;
            background: #5865f2;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .welcome h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">✦ Nova AI</div>
        <button class="new-chat">+ New chat</button>
    </aside>

    <main class="main">

        <header class="topbar">
            Nova AI
        </header>

        <section class="chat">

            <div class="welcome">
                <h1>How can I help?</h1>
                <p>Ask Nova AI anything.</p>
            </div>

            <div class="input-area">
                <div class="input-box">
                    <input
                        type="text"
                        placeholder="Message Nova AI..."
                    >

                    <button class="send">↑</button>
                </div>
            </div>

        </section>

    </main>

</div>

</body>
</html>
