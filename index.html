<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080d18;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            background: #070b14;
            border-right: 1px solid #1d2638;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .new-chat {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 13px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .new-chat:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .history-title {
            margin-top: 25px;
            margin-bottom: 9px;
            color: #737f98;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-history {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
        }

        .history-item {
            width: 100%;
            padding: 10px 11px;
            border-radius: 9px;
            color: #b9c2d5;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.15s;
        }

        .history-item:hover {
            background: #131a2a;
            color: white;
        }

        /* MAIN */

        .main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 64px;
            min-height: 64px;
            border-bottom: 1px solid #1d2638;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 16px;
            font-weight: 600;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 35px 25px;
            scroll-behavior: smooth;
        }

        .welcome {
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding-bottom: 80px;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .welcome p {
            color: #8c97ad;
            font-size: 17px;
        }

        /* MESSAGE */

        .message {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 24px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .message.user .message-row {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 15px;
            background: #151d2e;
            color: #e9edf5;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.user .message-content {
            background: #5865f2;
            color: white;
        }

        .message-tools {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .message.user .message-tools {
            justify-content: flex-end;
        }

        .copy-button {
            border: none;
            background: transparent;
            color: #748099;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 6px;
            transition: 0.15s;
        }

        .copy-button:hover {
            background: #151d2e;
            color: white;
        }

        .loading {
            color: #8994aa;
            font-style: italic;
        }

        /* INPUT */

        .input-area {
            width: min(850px, calc(100% - 40px));
            margin: 0 auto 24px;
        }

        .input-box {
            width: 100%;
            display: flex;
            align-items: center;
            background: #121a2a;
            border: 1px solid #2a354b;
            border-radius: 16px;
            padding: 7px;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-box:focus-within {
            border-color: #5865f2;
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.12);
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            height: 45px;
            padding: 0 13px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #6f7b91;
        }

        .send {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            border: none;
            border-radius: 12px;
            background: #5865f2;
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .send:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 18px;
            }

            .messages {
                padding: 25px 12px;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .welcome p {
                font-size: 15px;
            }

            .message-content {
                max-width: 88%;
            }

            .input-area {
                width: calc(100% - 20px);
                margin-bottom: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ✦ Nova AI
        </div>

        <button class="new-chat" id="newChatButton">
            + New chat
        </button>

        <div class="history-title">
            Recent chats
        </div>

        <div class="chat-history" id="chatHistory"></div>

    </aside>

    <main class="main">

        <header class="topbar">
            Nova AI
        </header>

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask Nova AI anything.
                </p>

            </div>

        </section>

        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message Nova AI..."
                    autocomplete="off"
                >

                <button
                    class="send"
                    id="sendButton"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>

<script>

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const newChatButton = document.getElementById("newChatButton");
const messages = document.getElementById("messages");
const chatHistory = document.getElementById("chatHistory");

let chats = [];
let currentChat = null;


/* LOAD CHATS */

try {

    chats = JSON.parse(
        localStorage.getItem("novaChats") || "[]"
    );

    if (!Array.isArray(chats)) {
        chats = [];
    }

} catch {

    chats = [];

}


/* SAVE */

function saveChats() {

    localStorage.setItem(
        "novaChats",
        JSON.stringify(chats)
    );

}


/* COPY */

async function copyText(text, button) {

    try {

        await navigator.clipboard.writeText(text);

        const original =
            button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {

            button.textContent = original;

        }, 1500);

    } catch {

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        const original =
            button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {

            button.textContent = original;

        }, 1500);

    }

}


/* ADD MESSAGE */

function addMessage(text, type) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const row =
        document.createElement("div");

    row.className =
        "message-row";


    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent = text;


    row.appendChild(content);

    message.appendChild(row);


    /*
        Only Nova's responses get
        a Copy button.
    */

    if (type === "assistant") {

        const tools =
            document.createElement("div");

        tools.className =
            "message-tools";


        const copyButton =
            document.createElement("button");

        copyButton.className =
            "copy-button";

        copyButton.textContent =
            "Copy";


        copyButton.addEventListener(
            "click",
            function() {

                copyText(
                    text,
                    copyButton
                );

            }
        );


        tools.appendChild(copyButton);

        message.appendChild(tools);

    }


    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;


    return message;

}


/* HISTORY */

function renderHistory() {

    chatHistory.innerHTML = "";


    chats.forEach(
        function(chat, index) {

            const item =
                document.createElement("div");

            item.className =
                "history-item";

            item.textContent =
                chat.title ||
                "New conversation";


            item.addEventListener(
                "click",
                function() {

                    loadChat(index);

                }
            );


            chatHistory.appendChild(item);

        }
    );

}


/* LOAD CHAT */

function loadChat(index) {

    const chat =
        chats[index];

    if (!chat) {
        return;
    }


    currentChat = chat;


    messages.innerHTML = "";


    if (
        !chat.messages ||
        chat.messages.length === 0
    ) {

        messages.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask Nova AI anything.
                </p>

            </div>

        `;

        return;

    }


    chat.messages.forEach(
        function(message) {

            addMessage(

                message.content,

                message.role === "user"
                    ? "user"
                    : "assistant"

            );

        }
    );


    input.focus();

}


/* NEW CHAT */

function startNewChat() {

    currentChat = null;


    messages.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                How can I help?
            </h1>

            <p>
                Ask Nova AI anything.
            </p>

        </div>

    `;


    input.value = "";

    input.focus();

}


/* SEND */

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /*
        Create a chat.
    */

    if (!currentChat) {

        currentChat = {

            title:
                text.substring(0, 35),

            messages: []

        };


        chats.push(currentChat);

        saveChats();

        renderHistory();

    }


    /*
        Add user message.
    */

    currentChat.messages.push({

        role: "user",

        content: text

    });


    addMessage(
        text,
        "user"
    );


    input.value = "";


    /*
        Disable controls.
    */

    input.disabled = true;

    sendButton.disabled = true;


    /*
        Loading.
    */

    const loading =
        addMessage(
            "Nova AI is thinking...",
            "assistant"
        );


    loading
        .querySelector(".message-content")
        .classList.add("loading");


    try {

        /*
            Send the previous conversation
            to the backend.
        */

        const history =
            currentChat.messages.slice(
                0,
                -1
            );


        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            history:
                                history

                        })

                }
            );


        const data =
            await response.json();


        loading.remove();


        /*
            API error.
        */

        if (!response.ok) {

            addMessage(

                data.error ||
                "AI request failed.",

                "assistant"

            );

            return;

        }


        /*
            Add response.
        */

        const reply =
            data.reply ||
            "I couldn't generate a response.";


        addMessage(
            reply,
            "assistant"
        );


        /*
            Save response.
        */

        currentChat.messages.push({

            role: "assistant",

            content: reply

        });


        saveChats();

        renderHistory();


    } catch (error) {

        console.error(error);


        loading.remove();


        addMessage(

            "I couldn't connect to Nova AI.",

            "assistant"

        );

    }


    /*
        Re-enable controls.
    */

    input.disabled = false;

    sendButton.disabled = false;

    input.focus();

}


/* BUTTON */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* NEW CHAT */

newChatButton.addEventListener(
    "click",
    startNewChat
);


/* START */

renderHistory();

input.focus();

</script>

</body>
</html>
