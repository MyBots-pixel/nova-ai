<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #080d19;
            border-right: 1px solid #20283a;
            padding: 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .new-chat {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .new-chat:hover,
        .send:hover {
            opacity: 0.85;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 65px;
            border-bottom: 1px solid #20283a;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #9ca6bb;
            font-size: 17px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 22px;
            line-height: 1.6;
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 14px;
            background: #151c2d;
            white-space: pre-wrap;
            text-align: left;
        }

        .user .message-content {
            background: #5865f2;
        }

        .input-area {
            width: min(800px, 90%);
            margin: 0 auto 25px;
        }

        .input-box {
            display: flex;
            background: #151c2d;
            border: 1px solid #303a52;
            border-radius: 16px;
            padding: 8px;
        }

        input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 12px;
        }

        .send {
            width: 45px;
            height: 45px;
            border: 0;
            border-radius: 12px;
            background: #5865f2;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .loading {
            color: #9ca6bb;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .messages {
                padding: 20px 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">✦ Nova AI</div>

        <button class="new-chat" onclick="newChat()">
            + New chat
        </button>
    </aside>

    <main class="main">

        <header class="topbar">
            Nova AI
        </header>

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">
                <h1>How can I help?</h1>
                <p>Ask Nova AI anything.</p>
            </div>

        </section>

        <div class="input-area">
            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message Nova AI..."
                    autocomplete="off"
                >

                <button class="send" onclick="sendMessage()">
                    ↑
                </button>

            </div>
        </div>

    </main>

</div>

<script>

const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;

    message.appendChild(content);
    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";

    addMessage(message, "user");

    const loadingMessage = addMessage(
        "Nova AI is thinking...",
        "assistant"
    );

    loadingMessage.querySelector(".message-content").classList.add("loading");

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        loadingMessage.remove();

        if (!response.ok) {
            addMessage(
                data.error || "Something went wrong.",
                "assistant"
            );
            return;
        }

        addMessage(
            data.reply || "I didn't receive a response.",
            "assistant"
        );

    } catch (error) {

        loadingMessage.remove();

        addMessage(
            "I couldn't connect to the AI server.",
            "assistant"
        );

        console.error(error);
    }
}

function newChat() {

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>How can I help?</h1>
            <p>Ask Nova AI anything.</p>
        </div>
    `;

}

</script>

</body>
</html>
